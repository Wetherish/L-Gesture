[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "l-gesture"
version = "0.1.0"
description = "Modular face and hand interaction toolkit for the Logitech LogiInsight webcam"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "paramiko>=3,<5",
    "numpy>=1.24,<3",
    "opencv-python>=4.8,<6",
    "cv2-enumerate-cameras>=1.4,<2",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
l-gesture = "l_gesture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"l_gesture.vendor.logiinsight" = ["LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/l_gesture/vendor", "examples/logiinsight"]
